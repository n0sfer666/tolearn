name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check

  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          key: ${{ matrix.os }}
      - name: install linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
      - name: build the frontend the app compiles into itself
        run: pnpm -C ui build
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  speech:
    name: speech (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          key: speech-${{ matrix.os }}
      - name: install linux audio dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - uses: actions/cache@v4.2.4
        id: weights
        with:
          path: models
          key: whisper-small-q5_1-ae85e4a9
      - name: download whisper weights
        if: steps.weights.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p models
          curl -fL --retry 3 -o models/ggml-small-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
      - name: verify whisper weights
        shell: bash
        run: |
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  models/ggml-small-q5_1.bin" > models/sha256
          if command -v sha256sum >/dev/null; then sha256sum -c models/sha256; else shasum -a 256 -c models/sha256; fi
      - name: declare the runner a shared vm
        if: matrix.os != 'macos-latest'
        shell: bash
        run: echo "TOLEARN_SPEECH_SHARED_CPU=1" >> "$GITHUB_ENV"
      - run: cargo clippy -p tolearn-speech --features speech --all-targets --locked -- -D warnings
      - run: cargo test -p tolearn-speech --features speech --locked -- --nocapture
        env:
          TOLEARN_WHISPER_MODEL: ${{ github.workspace }}/models/ggml-small-q5_1.bin

  package:
    name: package (${{ matrix.variant }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        variant: [base, with-speech]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: ${{ matrix.variant == 'with-speech' && 'recursive' || 'false' }}
      - name: install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          key: package-${{ matrix.variant }}-${{ matrix.os }}
      - name: install linux bundling dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libasound2-dev
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
      - uses: actions/cache@v4.2.4
        id: bundler
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2.11.4-${{ matrix.os }}
      - name: install tauri cli
        if: steps.bundler.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.11.4 --locked
        env:
          RUSTFLAGS: ""
      - uses: actions/cache@v4.2.4
        if: matrix.variant == 'with-speech'
        id: weights
        with:
          path: models
          key: whisper-small-q5_1-ae85e4a9
      - name: download whisper weights
        if: matrix.variant == 'with-speech' && steps.weights.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p models
          curl -fL --retry 3 -o models/ggml-small-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
      - name: put verified weights into the bundle resources
        if: matrix.variant == 'with-speech'
        shell: bash
        run: |
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  models/ggml-small-q5_1.bin" > models/sha256
          if command -v sha256sum >/dev/null; then sha256sum -c models/sha256; else shasum -a 256 -c models/sha256; fi
          mkdir -p app/models
          cp models/ggml-small-q5_1.bin app/models/ggml-small-q5_1.bin
      - name: bundle
        if: matrix.variant == 'base'
        run: cargo tauri build
        working-directory: app
      - name: bundle with speech
        if: matrix.variant == 'with-speech'
        run: cargo tauri build --features speech --config tauri.with-speech.conf.json
        working-directory: app
      - name: weigh the installer
        run: sh scripts/weigh.sh target/release/bundle ${{ matrix.variant }}
        shell: bash

  ui:
    name: ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENSSL_NO_VENDOR: 1
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install openssl headers for the export binary
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui lint
      - run: pnpm -C ui tokens
      - run: pnpm -C ui test
      - run: pnpm -C ui markdown
