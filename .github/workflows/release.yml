name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: the tag must name the version the app calls itself
        run: |
          version=$(grep -m1 '"version"' app/tauri.conf.json | cut -d '"' -f4)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "тег $GITHUB_REF_NAME не совпадает с версией $version из app/tauri.conf.json" >&2
            exit 1
          fi
      - name: the tagged commit must already be green
        run: |
          verdict=$(gh run list --workflow CI --commit "$GITHUB_SHA" --limit 1 \
            --json conclusion --jq '.[0].conclusion // "прогонов нет"')
          if [ "$verdict" != "success" ]; then
            echo "CI на коммите $GITHUB_SHA: $verdict" >&2
            exit 1
          fi

  build:
    needs: gate
    uses: ./.github/workflows/package.yml
    with:
      upload: true

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers
      - name: draft the release with all six installers
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* \
              --draft \
              --title "tolearn $GITHUB_REF_NAME" \
              --notes "Какой вариант скачивать и сколько он весит — [docs/release.md](https://github.com/n0sfer666/tolearn/blob/$GITHUB_REF_NAME/docs/release.md)."
          fi
