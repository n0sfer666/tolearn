[dev-dependencies]
flate2.workspace = true
tar.workspace = true
zip.workspace = true

[build-dependencies]
tauri-build.workspace = true

[[bin]]
name = "tolearn-desktop"
path = "src/main.rs"

[lints]
workspace = true
