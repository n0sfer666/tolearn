schema: tolearn/stage/1
id: voices
title: Голоса чипа
blocks:
  - id: "68f347b0"
    kind: heading
    text: Пять каналов 2A03
  - id: "874672f8"
    kind: paragraph
    text: >-
      Звуком NES управляет процессор 2A03: рядом с ядром 6502 в нём живёт
      звуковой блок APU с пятью каналами. Два **импульсных** канала ведут
      мелодию и гармонию, **треугольный** — басовую линию, **шумовой** —
      ударные. Пятый, DPCM, проигрывает короткие сэмплы; о нём — в третьем
      этапе.
  - id: "47635068"
    kind: diagram
    text: |-
      flowchart LR
        P1[Импульс 1] --> M[Микшер]
        P2[Импульс 2] --> M
        T[Треугольник] --> M
        N[Шум] --> M
        M --> D[ЦАП] --> S[Динамик]
    asset: assets/voices.svg
  - id: "937ff0f4"
    kind: paragraph
    text: >-
      Импульсный канал выдаёт прямоугольную волну. Её **скважность** — доля
      периода, когда сигнал наверху, — выбирается из четырёх значений: 12,5 %,
      25 %, 50 % и 75 %. На слух 25 % и 75 % не различить: это одна и та же
      волна, перевёрнутая.
  - id: "294ba0a9"
    kind: image
    text: >-
      Импульсная волна со скважностью 50 %: половину периода сигнал наверху,
      половину внизу.
    asset: assets/pulse-wave.png
    license: CC0-1.0
    attribution: toLearn contributors
  - id: "5a738269"
    kind: paragraph
    text: >-
      Высоту ноты задаёт 11-битный таймер `t`: импульсный канал звучит с
      частотой `f = CPU / (16 × (t + 1))`, где `CPU` — 1 789 773 Гц у
      NTSC-консоли. Треугольник на том же `t` звучит октавой ниже. Регистры
      каналов расписаны на странице
      [APU в NESdev Wiki](https://www.nesdev.org/wiki/APU).
  - id: "12d3e33f"
    kind: code
    lang: python
    text: |-
      CPU = 1_789_773

      def timer(hz: float) -> int:
          return round(CPU / (16 * hz) - 1)

      print(timer(440.0))
  - id: "9bc182dd"
    kind: callout
    text: >-
      Таймер меньше 8 глушит импульсный канал: вместо ноты выше 12 кГц чип
      молчит. Пропала нота — первым делом проверьте таймер.
  - id: "cd3e86d8"
    kind: paragraph
    text: >-
      Шумовой канал высоту не держит: он выдаёт псевдослучайную
      последовательность битов и в треках играет хай-хэт и малый барабан. Как
      ограничения чипа сложились в звучание 8-битных игр, рассказывает книга
      Карен Коллинз «Game Sound», гл. 2.
practice:
  task:
    - id: "15bf109d"
      kind: paragraph
      text: >-
        Посчитайте таймеры импульсного канала для гаммы до мажор от C4 до C5 и
        сыграйте её в любом NES-трекере — FamiTracker или FamiStudio.
    - id: "d67d412d"
      kind: paragraph
      text: >-
        Частоты нот возьмите из равномерно темперированного строя с A4 =
        440 Гц. Скважность выберите одну на всю гамму.
  deliverable: >-
    Таблица «нота — частота — таймер» на восемь нот и файл трекера с
    записанной гаммой.
  constraints:
    - id: c1
      claim: Таймеры посчитаны по формуле импульсного канала NTSC.
      expect: У A4 таймер 253, у C4 — 427.
    - id: c2
      claim: Скважность одна на всю гамму.
      expect: Во всех восьми нотах трекера выбран один и тот же duty.
  acceptance:
    - id: a1
      claim: В таблице восемь нот гаммы.
      expect: >-
        C4, D4, E4, F4, G4, A4, B4, C5 с таймерами 427, 380, 338, 319, 284,
        253, 225, 213.
    - id: a2
      claim: Гамма звучит чисто.
      expect: На слух ни одна нота не выбивается из строя.
questions:
  - id: q1
    text: Сколько каналов у APU в 2A03 и за что отвечает каждый?
    answer: >-
      Пять. Два импульсных — мелодия и гармония, треугольный — бас, шумовой —
      ударные, DPCM — короткие сэмплы.
  - id: q2
    text: Почему скважности 25 % и 75 % звучат одинаково?
    answer: >-
      Волна 75 % — это волна 25 %, перевёрнутая по амплитуде. Спектр у них
      один и тот же, а ухо различает спектр, а не знак сигнала.
  - id: q3
    text: >-
      Какой таймер нужен импульсному каналу NTSC-консоли, чтобы сыграть
      A4 = 440 Гц?
    answer: >-
      253: round(1 789 773 / (16 × 440) − 1). Проверка: 1 789 773 / (16 × 254)
      ≈ 440,4 Гц.
  - id: q4
    text: Что прозвучит, если записать тот же таймер в треугольный канал?
    answer: >-
      Та же нота октавой ниже: на равном таймере треугольник звучит вдвое ниже
      импульсного канала.
