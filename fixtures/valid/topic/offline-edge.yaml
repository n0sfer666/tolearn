practice:
  kind: code
  tier: P3
  time_box_min: 90
  task: |
    Пройди по списку материалов темы и разложи их на три группы: сохранятся,
    сохранятся заглушкой, не сохранятся вовсе. Обоснуй каждую группу полем.
  deliverable: |
    Файл liveness.md с тремя группами и полем-обоснованием на каждый материал.
  starting_point: |
    Список materials этой темы; инструменты не запускать.
  fallback: |
    Если сомневаешься в группе — положи материал в «сохранится заглушкой» и
    напиши, какого поля не хватило для решения.
  smoke_checked: true
  constraints:
    - id: c1
      claim: |
        Ни один материал не скачивался: решение принято по полям бандла.
      check: |
        bash -c 'grep -ci "liveness" liveness.md'
      expect: |
        Число не меньше 1.
    - id: c2
      claim: |
        Все девять материалов разложены, ни один не потерян.
      check: |
        bash -c 'grep -c "^- " liveness.md'
      expect: |
        Ровно 9.
  acceptance:
    - id: a1
      claim: |
        Материал за пейволом отнесён к заглушкам, а не к недоступным.
      check: |
        bash -c 'grep -c "paywall" liveness.md'
      expect: |
        Число не меньше 1.
    - id: a2
      claim: |
        Материал с `login_required` отнесён к недоступным.
      check: |
        bash -c 'grep -c "login_required" liveness.md'
      expect: |
        Число не меньше 1.
questions:
  - id: q1
    type: misconception
    text: |
      Материал за пейволом не скачался. Стоит ли пробовать ещё раз и почему?
    expected_signals:
      - |
        Говорит, что отказ пришёл от сервиса, а не от сети, и повтор не поможет.
    red_flags:
      - |
        Предлагает повторить попытку или сменить сеть.
    follow_up: |
      А чем этот случай отличается от обрыва соединения на середине?
  - id: q2
    type: diagnose
    text: |
      В сохранённой копии материала — страница входа вместо текста. Какое поле
      материала предсказало бы это заранее?
    expected_signals:
      - |
        Называет `liveness` со значением `login_required`.
    red_flags:
      - |
        Ищет причину в настройках инструмента сохранения.
    follow_up: null
exam:
  focus: |
    Отличает ли человек недоступность материала от его устаревания и умеет ли
    предсказывать исход сохранения по полям, не запуская инструменты.
  traps:
    - |
      Предложить «просто попробовать скачать всё и посмотреть, что выйдет».
    - |
      Назвать `stale: true` причиной не показывать материал.
  artifact_required: true
  max_exchanges: 6
