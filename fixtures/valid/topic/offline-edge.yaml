schema: learning-roadmap/topic/v1
id: offline-edge
title: Материалы, которые офлайн не тянутся
stage: 2
depends_on:
  - stale-knowledge
est_hours: [1, 3]
volatility: volatile
revalidate_after_days: 90
verified_at: "2026-07-20"
confidence: high
retention: by_use
version_context:
  - yt_dlp
  - monolith
outcomes:
  - |
    Может по одному полю `liveness` сказать, что произойдёт при попытке скачать
    материал, и почему приложение обязано показать это до попытки, а не после.
  - |
    Различает «материал недоступен» и «материал устарел»: первое про доступ,
    второе про содержание.
misconceptions:
  - |
    «Пейвол — это ошибка сети» — нет: сеть работает, отказ приходит от сервиса,
    и повторная попытка ничего не изменит.
  - |
    «Видео можно сохранить так же, как страницу» — страница и видео уходят в
    разные инструменты, и оба могут отсутствовать в системе.
