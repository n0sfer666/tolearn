[package]
name = "tolearn-speech"
description = "Microphone capture and local speech recognition: the only crate allowed to speak to whisper.cpp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
speech = ["dep:cpal"]

[dependencies]
cpal = { workspace = true, optional = true }

[build-dependencies]
cc.workspace = true
cmake.workspace = true

[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unwrap_used = "warn"
